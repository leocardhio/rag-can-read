version: "3.8"

services:
  fastapi-app:
    build: Dockerfile.service
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  postgres-db:
    build: Dockerfile.database
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    external: true
  